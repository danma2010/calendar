<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Israel Calendar</title>
<style>
  :root{
    --sat:#e0e7ff; --sat-head:#c7d2fe; --hol:#fdf0c2; --hol-line:#f1d27a; --hol-text:#9a3412;
    --week:#4f46e5; --red:#dc2626; --black:#111827; --joker:#7c3aed;
    --line:#d6dae3; --empty:#f6f7f9; --muted:#6b7280; --ink:#111827;
  }
  @page { size: A4 landscape; margin: 4mm 5mm; }
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--ink);font-family:"Segoe UI",Arial,sans-serif;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}

  /* toolbar (screen only) */
  .toolbar{display:flex;gap:12px;align-items:center;justify-content:center;padding:9px 12px;
    background:#eef0f6;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .toolbar label{font-weight:700;font-size:14px;color:#374151}
  .toolbar select{font:inherit;font-weight:700;font-size:14px;padding:4px 8px;border:1px solid #9ca3af;border-radius:6px;background:#fff;cursor:pointer}
  .toolbar button{font:inherit;font-weight:700;font-size:14px;padding:6px 16px;border:0;border-radius:6px;
    background:var(--week);color:#fff;cursor:pointer}
  .toolbar button:hover{background:#4338ca}

  .sheet-wrap{overflow-x:auto;padding:6px 8px}
  .sheet{width:287mm;margin:0 auto}

  /* header: title left, legend right */
  .head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:1.2mm}
  .head h1{margin:0;font-size:13pt;font-weight:800;letter-spacing:.2px}
  .legend{display:flex;gap:3.5mm;align-items:center;font-size:6.5pt;color:#374151;direction:rtl}
  .legend .sw{display:inline-block;width:3mm;height:2.6mm;border:.5px solid #9ca3af;vertical-align:middle;margin-left:1mm}
  .legend b.w{color:var(--week)} .legend b.c{color:var(--red)}

  /* grid */
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  col.mcol{width:19mm}
  th,td{border:.5px solid var(--line);padding:0;overflow:hidden}
  thead th{font-size:6.2pt;font-weight:600;height:4.6mm;color:#374151;background:#f3f4f6}
  thead th.sat{background:var(--sat-head)}
  thead th.mhead{font-size:6.5pt;font-weight:800;letter-spacing:.3px}
  tbody th.month{font-size:7pt;font-weight:800;text-align:left;padding-left:1.2mm;background:#f9fafb;
    text-transform:uppercase;letter-spacing:.2px;color:#1f2937}
  td{height:15mm;vertical-align:top}
  td.empty{background:var(--empty)}
  td.sat{background:var(--sat)}
  td.hol{background:var(--hol);box-shadow:inset 0 0 0 .4px var(--hol-line)}
  td.sat.hol{background:var(--sat);box-shadow:inset 0 0 0 1.2px #e9b949}
  .cell{display:flex;flex-direction:column;align-items:center;height:100%;padding-top:.6mm;gap:.35mm;overflow:hidden}
  .day-num{font-size:7.5pt;font-weight:600;line-height:1}
  .holiday-text{font-size:4.7pt;line-height:1.12;color:var(--hol-text);font-weight:700;direction:rtl;text-align:center;
    width:100%;padding:0;letter-spacing:-.15px;word-break:keep-all;overflow-wrap:normal;hyphens:none;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .week-num{font-size:6.3pt;font-weight:800;color:var(--week);line-height:1}
  .card-badge{font-size:10pt;font-weight:800;line-height:1;letter-spacing:-.3px}
  .card-badge.red{color:var(--red)} .card-badge.black{color:var(--black)} .card-badge.joker{color:var(--joker)}
  td.today{outline:1.6px solid var(--week);outline-offset:-1.6px}

  /* footer */
  .foot{display:flex;justify-content:flex-end;align-items:center;gap:1.4mm;margin-top:1.2mm;font-size:6.2pt;color:var(--muted)}
  .foot img{width:4.6mm;height:4.6mm;display:block}

  @media print{
    .toolbar{display:none}
    .sheet-wrap{padding:0;overflow:visible}
    td.today{outline:none}
  }
</style>
</head>
<body>
<div class="toolbar">
  <label for="year">Select Year:</label>
  <select id="year"></select>
  <button id="print" type="button">Print / Save PDF</button>
</div>
<div class="sheet-wrap">
  <div class="sheet">
    <div class="head">
      <h1 id="heading"></h1>
      <div class="legend">
        <span><b class="w">W#</b> שבוע</span>
        <span><b class="c">A♥</b> קלף שבועי</span>
        <span><i class="sw" style="background:var(--sat)"></i>שבת</span>
        <span><i class="sw" style="background:var(--hol)"></i>חג / מועד / צום</span>
      </div>
    </div>
    <table id="cal" aria-label="Annual calendar"></table>

<script>
// ---- Hebrew calendar arithmetic (Reingold & Dershowitz) ----
const EPOCH = -1373427;
const isLeap = y => ((7 * y + 1) % 19) < 7;
const monthsInYear = y => isLeap(y) ? 13 : 12;
function elapsedDays(y) {
  const m = Math.floor((235 * y - 234) / 19);
  const parts = 12084 + 13753 * m;
  let d = 29 * m + Math.floor(parts / 25920);
  if ((3 * (d + 1)) % 7 < 3) d++;
  return d;
}
function yearDelay(y) {
  const a = elapsedDays(y - 1), b = elapsedDays(y), c = elapsedDays(y + 1);
  if (c - b === 356) return 2;
  if (b - a === 382) return 1;
  return 0;
}
const newYear = y => EPOCH + elapsedDays(y) + yearDelay(y);
const daysInYear = y => newYear(y + 1) - newYear(y);
function monthLength(y, m) {
  if ([2, 4, 6, 10, 13].includes(m)) return 29;
  if (m === 12 && !isLeap(y)) return 29;
  if (m === 8 && daysInYear(y) % 10 !== 5) return 29;
  if (m === 9 && daysInYear(y) % 10 === 3) return 29;
  return 30;
}
function hebToFixed(y, m, d) {
  let f = newYear(y) + d - 1;
  if (m < 7) {
    for (let i = 7; i <= monthsInYear(y); i++) f += monthLength(y, i);
    for (let i = 1; i < m; i++) f += monthLength(y, i);
  } else {
    for (let i = 7; i < m; i++) f += monthLength(y, i);
  }
  return f;
}
const fixedToDate = f => new Date(Date.UTC(1970, 0, 1) + (f - 719163) * 86400000);
const hebToDate = (y, m, d) => fixedToDate(hebToFixed(y, m, d));
const addDays = (dt, n) => new Date(dt.getTime() + n * 86400000);
const dow = dt => dt.getUTCDay();
const keyOf = dt => dt.toISOString().slice(0, 10);

// ---- Holidays (Israel). Every listed day is tinted and labelled. ----
const HEB_ORD = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ז׳','ח׳'];
function holidaysFor(G) {
  const map = new Map();                 // key -> [label, ...]
  const put = (dt, text) => {
    if (dt.getUTCFullYear() !== G) return;
    const k = keyOf(dt);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(text);
  };
  for (const hy of [G + 3760, G + 3761]) {
    const H = (m, d) => hebToDate(hy, m, d);
    const ADAR = isLeap(hy) ? 13 : 12;
    put(H(6, 29), 'ערב ראש השנה');
    put(H(7, 1), 'ראש השנה א׳');
    put(H(7, 2), 'ראש השנה ב׳');
    let g = H(7, 3); if (dow(g) === 6) g = addDays(g, 1); put(g, 'צום גדליה');
    put(H(7, 9), 'ערב יום כיפור');
    put(H(7, 10), 'יום כיפור');
    put(H(7, 14), 'ערב סוכות');
    put(H(7, 15), 'סוכות');
    for (let d = 16; d <= 20; d++) put(H(7, d), 'חוה״מ סוכות');
    put(H(7, 21), 'הושענא רבה');
    put(H(7, 22), 'שמחת תורה');
    const h1 = H(9, 25);
    for (let i = 0; i < 8; i++) put(addDays(h1, i), 'חנוכה ' + HEB_ORD[i]);
    put(H(10, 10), 'עשרה בטבת');
    put(H(11, 15), 'ט״ו בשבט');
    let te = H(ADAR, 13); if (dow(te) === 6) te = addDays(te, -2); put(te, 'תענית אסתר');
    put(H(ADAR, 14), 'פורים');
    put(H(ADAR, 15), 'שושן פורים');
    put(H(1, 14), 'ערב פסח');
    put(H(1, 15), 'פסח');
    for (let d = 16; d <= 20; d++) put(H(1, d), 'חוה״מ פסח');
    put(H(1, 21), 'שביעי של פסח');
    let sh = H(1, 27); if (dow(sh) === 5) sh = addDays(sh, -1); else if (dow(sh) === 0) sh = addDays(sh, 1);
    put(sh, 'יום השואה');
    let atz = H(2, 5);
    if (dow(atz) === 5) atz = addDays(atz, -1);
    else if (dow(atz) === 6) atz = addDays(atz, -2);
    else if (dow(atz) === 1) atz = addDays(atz, 1);
    put(addDays(atz, -1), 'יום הזיכרון');
    put(atz, 'יום העצמאות');
    put(H(2, 18), 'ל״ג בעומר');
    put(H(2, 28), 'יום ירושלים');
    put(H(3, 5), 'ערב שבועות');
    put(H(3, 6), 'שבועות');
    let t17 = H(4, 17); if (dow(t17) === 6) t17 = addDays(t17, 1); put(t17, 'צום י״ז בתמוז');
    let t9 = H(5, 9); if (dow(t9) === 6) t9 = addDays(t9, 1); put(t9, 'תשעה באב');
  }
  return map;
}

// ---- Weeks & cards ----
const RANKS = ['A','K','Q','J','10','9','8','7','6','5','4','3','2'];
const SUITS = [['♠','black'],['♥','red'],['♦','red'],['♣','black']];
function weeksFor(G) {
  const out = new Map();
  let d = new Date(Date.UTC(G, 0, 1));
  while (dow(d) !== 0) d = addDays(d, 1);
  let n = 1;
  while (d.getUTCFullYear() === G) {
    out.set(keyOf(d), { week: n });
    const mon = addDays(d, 1);
    if (mon.getUTCFullYear() === G) {
      const s = SUITS[Math.floor((n - 1) / 13)];
      out.set(keyOf(mon), { card: n <= 52 ? { text: RANKS[(n - 1) % 13] + s[0], cls: s[1] } : { text: '🃏', cls: 'joker' } });
    }
    d = addDays(d, 7); n++;
  }
  return out;
}

// ---- Render ----
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD = ['Su','Mo','Tu','We','Th','Fr','Sa'];
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(G) {
  const hol = holidaysFor(G), wk = weeksFor(G);
  const now = new Date();
  const todayKey = keyOf(new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate())));
  let h = '<colgroup><col class="mcol">' + '<col>'.repeat(37) + '</colgroup><thead><tr><th class="mhead">MONTH</th>';
  for (let c = 0; c < 37; c++) h += `<th class="${c % 7 === 6 ? 'sat' : ''}">${WD[c % 7]}</th>`;
  h += '</tr></thead><tbody>';
  for (let m = 0; m < 12; m++) {
    const first = dow(new Date(Date.UTC(G, m, 1)));
    const len = new Date(Date.UTC(G, m + 1, 0)).getUTCDate();
    h += `<tr><th class="month" scope="row">${MONTHS[m]}</th>`;
    for (let c = 0; c < 37; c++) {
      const d = c - first + 1;
      const sat = c % 7 === 6;
      if (d < 1 || d > len) { h += `<td class="${sat ? 'sat' : 'empty'}"></td>`; continue; }
      const k = keyOf(new Date(Date.UTC(G, m, d)));
      const labels = hol.get(k), w = wk.get(k);
      const cls = [sat && 'sat', labels && 'hol', k === todayKey && 'today'].filter(Boolean).join(' ');
      let inner = `<span class="day-num">${d}</span>`;
      if (labels) inner += `<span class="holiday-text">${labels.map(esc).join(' · ')}</span>`;
      if (w && w.week) inner += `<span class="week-num">W${w.week}</span>`;
      if (w && w.card) inner += `<span class="card-badge ${w.card.cls}">${w.card.text}</span>`;
      const title = labels ? ` title="${esc(labels.join(' · '))}"` : '';
      h += `<td class="${cls}" data-date="${k}"${title}><div class="cell">${inner}</div></td>`;
    }
    h += '</tr>';
  }
  h += '</tbody>';
  document.getElementById('cal').innerHTML = h;
  document.getElementById('heading').textContent = G + ' • Israel Calendar';
  document.title = G + ' • Israel Calendar';
}

// ---- Init ----
const sel = document.getElementById('year');
for (let y = 2026; y <= 2050; y++) sel.add(new Option(String(y), String(y)));
const DEFAULT_YEAR = Math.min(2050, Math.max(2026, new Date().getFullYear()));
sel.value = String(DEFAULT_YEAR);
sel.addEventListener('change', () => render(+sel.value));
document.getElementById('print').addEventListener('click', () => window.print());
render(DEFAULT_YEAR);
</script>
</body>
